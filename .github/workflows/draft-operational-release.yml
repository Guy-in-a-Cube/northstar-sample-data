name: Operational Data Releases

on:
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional completed Fabric run ID; blank selects the newest completion marker
        required: false
        type: string
      publish:
        description: Publish after validation instead of leaving a draft
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: operational-draft-release
  cancel-in-progress: false

jobs:
  draft-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sample-data-publish
    permissions:
      id-token: write
      contents: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      EXPORT_STORAGE_ACCOUNT: ${{ vars.EXPORT_STORAGE_ACCOUNT }}
      EXPORT_CONTAINER: ${{ vars.EXPORT_CONTAINER }}
      PROTECTED_OPERATIONAL_TAGS: >-
        ["operational-20261120T170446170Z-d6fa0db4-3b98-4163-940f-36ecaef08b73"]
    steps:
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($variable in 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'EXPORT_STORAGE_ACCOUNT', 'EXPORT_CONTAINER') {
            if (-not [Environment]::GetEnvironmentVariable($variable)) { throw "Missing environment variable: $variable" }
          }

      - name: Sign into Azure with OIDC
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Download and validate completed export
        id: prepare
        shell: pwsh
        env:
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualClient = az account show --query user.name --output tsv
          if ($LASTEXITCODE -ne 0 -or $actualClient -cne $env:AZURE_CLIENT_ID) { throw 'Unexpected Azure identity.' }
          $output = Join-Path $env:RUNNER_TEMP "northstar-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $parameters = @{ StorageAccount = $env:EXPORT_STORAGE_ACCOUNT; Container = $env:EXPORT_CONTAINER; OutputDirectory = $output }
          if ($env:GITHUB_EVENT_NAME -ceq 'schedule') { $parameters.RequireCurrentDay = $true }
          if ($env:REQUESTED_RUN_ID) { $parameters.RunId = $env:REQUESTED_RUN_ID }
          $json = (& ./scripts/prepare-operational-release.ps1 @parameters) -join "`n"
          $plan = $json | ConvertFrom-Json
          if ($plan.files.Count -ne 10) { throw 'Unexpected release asset count.' }
          & ./scripts/test-operational-release.ps1 -SourceDirectory (Split-Path -Parent $plan.files[0]) | ForEach-Object { Write-Host $_ }
          $planPath = Join-Path $output 'release-plan.json'
          [IO.File]::WriteAllText($planPath, $json, [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "plan_path=$planPath`n", [Text.UTF8Encoding]::new($false))

      - name: Publish or draft and apply operational retention
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN: ${{ steps.prepare.outputs.plan_path }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          $protected = @($env:PROTECTED_OPERATIONAL_TAGS | ConvertFrom-Json)
          $publish = $env:GITHUB_EVENT_NAME -ceq 'schedule' -or $env:REQUESTED_PUBLISH -ceq 'true'
          $result = & ./scripts/publish-operational-release.ps1 -PlanPath $env:RELEASE_PLAN -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -ProtectedTags $protected -KeepSnapshots 7 -Publish:$publish -Apply
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$($result.status): $($result.url)`nOlder operational snapshots removed: $($result.delete.Count). Protected course releases retained.`n", [Text.UTF8Encoding]::new($false))