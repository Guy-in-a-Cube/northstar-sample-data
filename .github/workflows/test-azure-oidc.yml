name: Test Azure OIDC

on:
  workflow_dispatch:

permissions: {}

jobs:
  test-authentication:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sample-data-publish
    permissions:
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      EXPORT_STORAGE_ACCOUNT: ${{ vars.EXPORT_STORAGE_ACCOUNT }}
      EXPORT_CONTAINER: ${{ vars.EXPORT_CONTAINER }}
    steps:
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID EXPORT_STORAGE_ACCOUNT EXPORT_CONTAINER; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing environment variable: $variable"
              exit 1
            fi
          done

      - name: Sign into Azure with OIDC
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Verify identity and read-only blob access
        shell: bash
        run: |
          set -euo pipefail
          actual_client_id="$(az account show --query user.name --output tsv)"
          if [[ "$actual_client_id" != "$AZURE_CLIENT_ID" ]]; then
            echo "::error::Azure signed in with an unexpected identity."
            exit 1
          fi
          blob_name="$(az storage blob list --account-name "$EXPORT_STORAGE_ACCOUNT" --container-name "$EXPORT_CONTAINER" --prefix 'operational-data/runs/' --num-results 1 --auth-mode login --only-show-errors --query '[0].name' --output tsv)"
          if [[ -z "$blob_name" ]]; then
            echo "::error::No operational export blobs were found."
            exit 1
          fi
          az storage blob show --account-name "$EXPORT_STORAGE_ACCOUNT" --container-name "$EXPORT_CONTAINER" --name "$blob_name" --auth-mode login --only-show-errors --query properties.contentLength --output tsv > /dev/null
          echo 'PASS: dedicated OIDC identity can list and read blob metadata. No CSVs were downloaded or published.'